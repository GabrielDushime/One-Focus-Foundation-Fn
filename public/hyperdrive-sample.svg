<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#e6eef9"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Left photo area -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="780" height="820" rx="16" fill="#111827"/>
    <rect x="20" y="20" width="740" height="560" rx="12" fill="#2b6cb0"/>
    <circle cx="120" cy="520" r="12" fill="#ffffff" opacity="0.6"/>
    <rect x="40" y="600" width="660" height="180" rx="8" fill="#0b1220" opacity="0.55"/>
    <text x="60" y="660" font-family="Inter, Arial, sans-serif" font-size="44" fill="#fff" font-weight="700">ONEFOCUS</text>
    <text x="60" y="712" font-family="Inter, Arial, sans-serif" font-size="28" fill="#fff" opacity="0.9">AFRICA</text>
  </g>

  <!-- Right content area -->
  <g transform="translate(860,40)">
    <rect x="0" y="0" width="500" height="820" rx="8" fill="#ffffff" stroke="#e6eef9"/>

    <text x="18" y="60" font-family="Georgia, serif" font-size="36" font-weight="800" fill="#0284c7">HYPERDRIVE</text>
    <text x="18" y="60" font-family="Georgia, serif" font-size="36" font-weight="800" fill="#000" opacity="0.12" transform="translate(220,0)">by ONEFOCUS AFRICA</text>

    <rect x="18" y="86" width="460" height="6" rx="3" fill="#1F99ED"/>

    <text x="18" y="132" font-family="Inter, Arial, sans-serif" font-size="14" fill="#374151" xml:space="preserve">
      HYPERDRIVE is a weekly youth empowerment experience created to connect young people and
    </text>
    <text x="18" y="156" font-family="Inter, Arial, sans-serif" font-size="14" fill="#374151">
      experienced professionals in one powerful space for learning, sharing, and growth.
    </text>

    <!-- Description box mimic -->
    <rect x="18" y="186" width="460" height="170" rx="10" fill="#ffffff" stroke="#e6eef9"/>
    <rect x="18" y="186" width="8" height="170" rx="2" fill="#1F99ED"/>
    <text x="36" y="214" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4b5563">
      The program helps youth discover careers, build confidence, and receive practical guidance by
    </text>
    <text x="36" y="236" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4b5563">
      giving them the opportunity to speak, pitch, and engage with mentors from different fields.
    </text>

    <!-- Bullets / activities -->
    <g transform="translate(18,374)">
      <circle cx="14" cy="14" r="10" fill="#1F99ED"/>
      <text x="36" y="19" font-family="Inter, Arial, sans-serif" font-size="14" fill="#111827" font-weight="700">Youth Pitches</text>
      <circle cx="190" cy="14" r="10" fill="#1F99ED"/>
      <text x="212" y="19" font-family="Inter, Arial, sans-serif" font-size="14" fill="#111827" font-weight="700">Experts Mentors</text>
      <circle cx="18" cy="52" r="10" fill="#1F99ED"/>
      <text x="36" y="57" font-family="Inter, Arial, sans-serif" font-size="14" fill="#111827" font-weight="700">Storytelling</text>
    </g>

    <!-- Purpose box at bottom -->
    <text x="18" y="480" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#0284c7">Purpose</text>
    <text x="18" y="510" font-family="Inter, Arial, sans-serif" font-size="13" fill="#374151">
      HYPERDRIVE aligns with ONEFOCUS AFRICA's mission to discover, nurture, and empower African youth by creating spaces where ideas are heard.
    </text>
  </g>
</svg>
